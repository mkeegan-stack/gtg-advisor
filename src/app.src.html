function setTeam(arr){S.teams=S.teams||{};logTeamChange(sub.teamKey,S.teams[sub.teamKey]||[],arr);S.teams[sub.teamKey]=arr;save();const sc=document.getElementById('sheet').scrollTop;teamSheet(sub.teamKey);document.getElementById('sheet').scrollTop=sc;}

/* ---------------- placement: where each hero stands (front L/M/R, back L/R) ---------------- */
const SLOTN=['front left','front middle','front right','back left','back right'];
/* Rules, with how sure we are:
   - Space Racer front left in ops (many players: "always slot 1"; weaker in slots 2, 4, 5).
   - Thragg at the back in This Is Heavy so the sacrifices get hit first and charge Kregg (players).
   - Powerplex front middle in a Maulerplex team (two players).
   - Slot 1 (front left) draws the most fire, so your biggest tank goes there (one player) - and game mechanics:
     melee heroes (range 1) belong in front, ranged heroes (range 2) and supports at the back. */
/* What each hero's own skill text says about where they act (game text): */
function heroAI(id){const t=skillText(id);return {
  taunt:/taunt/.test(t)&&/around him|nearby|all affected|adjacent|area/.test(t),     // pulls enemies onto himself: wants the most enemies next to him
  cone:/in front of him|cone|straight line|directly in front/.test(t),               // hits what's in front: wants to face the most enemies
  diver:/farthest|furthest|behind the furthest|dashes behind|swaps his own position/.test(t), // goes to the back of the enemy line by himself
  seeksAtk:/highest (available )?attack|strongest attack/.test(t),                  // goes after the enemy with the highest Attack
  seeksLow:/lowest (current |max )?hp/.test(t)};}                                    // goes after the enemy with the lowest HP
function frontness(id){const h=H[id];const a=heroAI(id);const melee=h.attackType==='Melee';return (h.role==='Defender'?4:0)+(melee?2:-2)+(h.role==='Support'?-1:0)+(a.taunt?2:0)+(a.cone?1:0)+(H[id].keepBase?1:0);}
function tankiness(id){const h=H[id];const s=h.stats660||{};const u=S.heroes[id]||{level:1};return (s.HP||50000)*(s.Defense||10000)/1e9*statMult(u)*(h.role==='Defender'?1.5:1);}
function atkOf(id){const s=H[id].stats660||{};return (s.Attack||30000)*statMult(S.heroes[id]||{level:1});}
function placeTeam(team,ctx={}){const t=team.filter(Boolean);if(t.length<=1)return {slots:[t[0]||null,null,null,null,null],notes:[]};
  const slots=[null,null,null,null,null],notes=[];const rest=[...t];const take=id=>{const i=rest.indexOf(id);if(i>=0)rest.splice(i,1);return i>=0;};const nm=id=>short(H[id].name);
  const op=ctx.opId||'';const mauler=t.filter(x=>(H[x].tags||[]).includes('Mauler')).length;const enemy=ctx.enemy||[];
  // 1. placements players agree on
  if(ctx.mode==='ops'&&t.includes('space-racer')&&take('space-racer')){slots[0]='space-racer';notes.push('Space Racer front left - players: from slot 1 his 4th skill rams through every enemy; he does worse in slots 2, 4 or 5.');}
  if(op==='this-is-heavy'&&t.includes('thragg')&&take('thragg')){slots[3]='thragg';notes.push('Thragg at the back - players: the sacrifices in front get hit first, which charges Kregg\'s 3rd skill sooner.');}
  // sacrifice comps: the sacrifices go in front so they're hit first; the carry waits at the back
  const oo=op&&G.ops.find(x=>x.id===op);
  if(oo&&oo.templates){const bd=opsTeamBreakdown(t,oo);const tp=oo.templates.find(x=>x.name===bd.tname)||{};const sacIds=[...new Set([...(tp.sac||[]),...(tp.sacAny||[])])].filter(x=>x!=='aquarus');
    const sc=t.filter(x=>sacIds.includes(x)&&!(tp.core||[]).includes(x));
    if(sc.length){let fi=[0,1,2,3,4].filter(i=>!slots[i]);sc.forEach(x=>{if(fi.length&&take(x))slots[fi.shift()]=x;});
      const carry=(tp.core||[]).filter(x=>rest.includes(x));let bi=[4,3].filter(i=>!slots[i]);carry.forEach(x=>{if(bi.length&&take(x))slots[bi.shift()]=x;});
      notes.push(`${[...new Set(sc)].map(nm).join(' / ')} in front: ${sc.length>1?'they\'re':'he\'s'} the sacrifice${sc.length>1?'s':''}, so ${sc.length>1?'they':'he'} should be hit and die first (players).`);}}
  if(op==='everyone-whos-anyone'&&t.includes('invincible')&&take('invincible')){slots[1]='invincible';if(take('cecil-stedman')){slots[3]='cecil-stedman';}notes.push('Yark front middle, Cecil at the back (top players\' layout).');}
  if(t.includes('powerplex')&&mauler>=2&&!slots[1]&&take('powerplex')){slots[1]='powerplex';notes.push('Powerplex front middle in a Maulerplex team (players).');}
  // 2. taunters with an area effect and frontal-cone hitters want the middle of the front row: most enemies within reach
  const mid=rest.filter(id=>heroAI(id).taunt).sort((a,b)=>tankiness(b)-tankiness(a))[0]||rest.filter(id=>heroAI(id).cone&&H[id].attackType==='Melee')[0];
  if(mid&&!slots[1]&&take(mid)){slots[1]=mid;notes.push(`${nm(mid)} front middle - ${heroAI(mid).taunt?'his skill taunts the enemies around him, and the middle has the most enemies close by':'his skill hits what\'s in front of him, and the middle faces the most enemies'}.`);}
  // 3. the rest: most front-suited in front, toughest on the left (slot 1 draws the most fire - players); ranged and supports behind
  const order=rest.slice().sort((a,b)=>frontness(b)-frontness(a)||tankiness(b)-tankiness(a));
  const frontFree=[0,1,2].filter(i=>!slots[i]),backFree=[3,4].filter(i=>!slots[i]);
  const nFront=Math.min(frontFree.length,Math.max(0,order.length-backFree.length));const fr=order.slice(0,nFront).sort((a,b)=>tankiness(b)-tankiness(a)),bk=order.slice(nFront);
  fr.forEach((id,i)=>{slots[frontFree[i]]=id;});bk.forEach((id,i)=>{if(backFree[i]!==undefined)slots[backFree[i]]=id;});
  const isSac=id=>!!(oo&&oo.templates&&oo.templates.some(tp=>[...(tp.sac||[]),...(tp.sacAny||[])].includes(id)&&!(tp.core||[]).includes(id)));
  if(slots[0]&&slots[0]!=='space-racer'&&!isSac(slots[0]))notes.push(`${nm(slots[0])} front left - slot 1 draws the most fire (players), so the toughest front-liner goes there.`);
  const rangedFront=fr.filter(x=>H[x].attackType!=='Melee');if(rangedFront.length)notes.push(`${rangedFront.map(nm).join(', ')} ${rangedFront.length>1?'are':'is'} ranged but in front only because the team has too few melee heroes.`);
  t.filter(id=>heroAI(id).diver).forEach(id=>notes.push(`${nm(id)} goes to the back of their line by himself, so his starting spot matters less.`));
  // 4. what the enemy's skills go after (when you've told the app who they are)
  if(enemy.length){const atkSeek=enemy.filter(e=>heroAI(e).seeksAtk),dive=enemy.filter(e=>heroAI(e).diver),low=enemy.filter(e=>heroAI(e).seeksLow);
    if(atkSeek.length){const top=t.slice().sort((a,b)=>atkOf(b)-atkOf(a))[0];const ti=slots.indexOf(top);
      if(ti>=0&&ti<3&&top!=='space-racer'){const bi=[3,4].filter(i=>slots[i]).sort((a,b)=>frontness(slots[b])-frontness(slots[a]))[0];if(bi!==undefined){const o=slots[bi];slots[bi]=top;slots[ti]=o;notes.push(`${nm(top)} moved to the back and ${nm(o)} to the front to protect him:`);}}
      notes.push(`Their ${atkSeek.map(nm).join(', ')} go${atkSeek.length>1?'':'es'} after your highest-Attack hero (${nm(top)}) - keep him behind a taunting tank or give him a survival artifact.`);}
    if(dive.length)notes.push(`Their ${dive.map(nm).join(', ')} reach${dive.length>1?'':'es'} your back row - don't put a fragile healer there alone.`);
    if(low.length){const sq=t.slice().sort((a,b)=>tankiness(a)-tankiness(b))[0];notes.push(`Their ${low.map(nm).join(', ')} go${low.length>1?'':'es'} after your lowest-HP hero (${nm(sq)}).`);}}
  const bkIds=[slots[3],slots[4]].filter(Boolean);const bkR=bkIds.filter(x=>H[x].attackType!=='Melee'),bkM=bkIds.filter(x=>H[x].attackType==='Melee');
  if(bkR.length)notes.push(`${bkR.map(nm).join(' and ')} at the back - ranged heroes hit from 2 cells away, so they stay safe behind the front row.`);
  if(bkM.length)notes.push(`${bkM.map(nm).join(' and ')} ${bkM.length>1?'are':'is'} melee but at the back because the front row is full - ${bkM.length>1?'they walk':'he walks'} forward once a gap opens.`);
  return {slots,notes};}
/* compare the order you entered (taken as your in-game order) with the suggested placement; only differences that matter */
function placementFixes(mine,ctx){if(mine.length<2)return [];const p=placeTeam(mine,ctx);const out=[];const row=i=>i<3?'front':'back';
  const cnt=(arr,id,front)=>arr.filter((x,i)=>x===id&&(i<3)===front).length;
  mine.forEach((id,i)=>{const dup=mine.filter(x=>x===id).length>1;if(dup){if(cnt(mine,id,true)!==cnt(p.slots,id,true)&&mine.indexOf(id)===i)out.push(`${short(H[id].name)}: ${cnt(p.slots,id,true)} in front, ${cnt(p.slots,id,false)} at the back`);return;}
    const j=p.slots.indexOf(id);if(j<0)return;const pinned=(id==='space-racer'&&ctx.mode==='ops')||(id==='thragg'&&ctx.opId==='this-is-heavy')||(id==='powerplex'&&j===1);
    if(row(i)!==row(j)||(pinned&&i!==j)||(j===0&&i!==0&&tankiness(id)>tankiness(mine[0])*1.3))out.push(`${short(H[id].name)}: ${SLOTN[i]} → ${SLOTN[j]}`);});
  return out;}
function pitchHTML(slots,mode,opts={}){const cell=(id,i)=>`<div class="pcell" style="grid-column:${i<3?(i*2+1)+' / span 2':(i===3?'2 / span 2':'4 / span 2')}">${id?tileHTML(id,{mini:true,mode,dim:opts.dim}):'<div class="pempty">empty</div>'}<div class="plbl">${SLOTN[i]}</div></div>`;
  return `<div class="pitch">${slots.map(cell).join('')}</div>`;}
function placementBlock(mine,ctx){const f=placementFixes(mine,ctx);const p=placeTeam(mine,ctx);
  return `<details style="margin-top:8px"${f.length?' open':''}><summary class="tiny"><b>Positions</b>${f.length?` — ${f.length} change${f.length>1?'s':''} suggested`:' ✓'}</summary><div>${pitchHTML(p.slots,ctx.mode)}${f.length?`<p class="tiny" style="margin-top:6px">If the order you entered is your in-game order: ${esc(f.join('; '))}.</p><button class="btn small" style="margin-top:6px" data-posapply="${esc(ctx.opId||'pvp')}">Use these positions</button>`:''}<p class="tiny muted">${esc(p.notes.join(' '))}</p></div></details>`;}

/* ---------------- battle planner: counter an enemy line-up you enter ---------------- */
function rankForLevel(lv){lv=+lv||1;for(let i=0;i<G.rankTable.length;i++){if(G.rankTable[i].rank==='Omnipotent+')break;if(G.rankTable[i].cap>=lv)return {rank:G.rankTable[i].rank,level:lv,stars:0};}
  return {rank:'Omnipotent+',level:lv,stars:Math.max(0,Math.ceil((lv-660)/20))};}
function unitStats(id,u){const s=H[id].stats660||{};const m=statMult(u);return {id,HP:(s.HP||60000)*m,ATK:(s.Attack||35000)*m,DEF:(s.Defense||12000)*m,EA:(s['Energy Attack']||100)/100,PA:(s['Physical Attack']||100)/100,ED:(s['Energy Defense']||100)/100,PD:(s['Physical Defense']||100)/100};}
const BEATS={};(G.factionAdvantage||[]).forEach(r=>BEATS[r.attacker]=r.vs);
function skillText(id){return (H[id].skills||[]).map(s=>s.text||'').join(' ').toLowerCase();}
function hasTag(id,t){return (H[id].tags||[]).some(g=>g.toLowerCase().includes(t));}
/* bonus a hero gets from what their own skill text says, against this enemy team (game text, not opinion) */
function textEdge(id,enemy){const t=skillText(id);let m=1;const why=[];const n=k=>enemy.filter(e=>hasTag(e,k)).length;
  [['human','Human'],['viltrumite','Viltrumite'],['grounded','grounded'],['flying','flying']].forEach(([k,lab])=>{if(t.includes(k)){const c=n(k);if(c){m*=1+0.05*c;why.push(`${short(H[id].name)}'s skills target ${lab} enemies (${c} of theirs)`);}}});
  if(/all enemies|every enemy|all grounded enemies/.test(t)&&enemy.length>=4){m*=1.05;}
  return {m,why};}
function teamPowerModel(units){return units.reduce((a,x)=>a+x.ATK*2+x.HP/4+x.DEF*3,0);}
function sustain(team){const healers=team.filter(id=>/heal/.test(skillText(id))&&H[id].role!=='Attacker').length;const shields=team.filter(id=>/shield/.test(skillText(id))).length;return 1+Math.min(0.25,0.1*healers)+Math.min(0.12,0.05*shields);}
function dmgOf(a,b,ha,hb){const f=BEATS[H[ha].faction]===H[hb].faction?1.2:1;return a.ATK*20*(a.EA/(b.DEF/1000*b.ED)+a.PA/(b.DEF/1000*b.PD))/1000*f*1.025;}
function sideDamage(att,def,attIds,defIds,frontIds){let tot=0;att.forEach((a,i)=>{const id=attIds[i];const melee=H[id].attackType==='Melee';const pool=defIds.map((d,j)=>j).filter(j=>!melee||frontIds.includes(defIds[j])||frontIds.length===0);
    const avg=pool.reduce((s,j)=>s+dmgOf(a,def[j],id,defIds[j]),0)/Math.max(1,pool.length);tot+=avg*textEdge(id,defIds).m*(H[id].role==='Attacker'?1:0.6);});return tot;}
/* R > 1 means your side kills theirs faster than they kill you */
function battleEval(myIds,enemy,cal){const mine=myIds.map(id=>unitStats(id,S.heroes[id]));let en=enemy.map(e=>unitStats(e.id,rankForLevel(e.level)));
  if(cal&&cal.my&&cal.en){const k=(cal.en/cal.my)/(teamPowerModel(en)/Math.max(1,teamPowerModel(mine)));en=en.map(x=>({...x,HP:x.HP*k,ATK:x.ATK*k,DEF:x.DEF*k}));}
  const enIds=enemy.map(e=>e.id);const myFront=placeTeam(myIds,{mode:'battle',enemy:enemy.map(e=>e.id)}).slots.slice(0,3).filter(Boolean);const enFront=enemy.filter(e=>e.slot<3).map(e=>e.id);
  const myD=sideDamage(mine,en,myIds,enIds,enFront),enD=sideDamage(en,mine,enIds,myIds,myFront);
  const myHP=mine.reduce((a,x)=>a+x.HP,0)*sustain(myIds),enHP=en.reduce((a,x)=>a+x.HP,0)*sustain(enIds);
  return {R:(myD/enHP)/(enD/myHP),myD,enD,myHP,enHP};}
function allowedFor(b){const r=b.restrict||{};let ids=owned().filter(id=>!H[id].keepBase);
  if(r.factions&&r.factions.length)ids=ids.filter(id=>r.factions.includes(H[id].faction));
  if(r.tags&&r.tags.length)ids=ids.filter(id=>r.tags.some(t=>(H[id].tags||[]).includes(t)));
  if(r.only&&r.only.length)ids=ids.filter(id=>r.only.includes(id));
  if(r.not&&r.not.length)ids=ids.filter(id=>!r.not.includes(id));return ids;}
/* a hero's current build, so a lost team comes back once you've upgraded any of its heroes */
function heroSnap(id){const u=S.heroes[id]||{};const a=u.artifact||'';return [u.rank,+u.stars||0,+u.level||0,(u.skills||[]).join('.'),a,+(S.artifacts[a]||{}).level||0].join('|');}
function teamSnap(team){const o={};team.forEach(id=>o[id]=heroSnap(id));return o;}
function upgradedSince(att){return att.team.filter(id=>att.snap&&att.snap[id]!==undefined&&att.snap[id]!==heroSnap(id));}
function myModelP(team){return teamPowerModel(team.map(id=>unitStats(id,S.heroes[id])));}
function powerK(){const L=(S.powerCal||[]).map(x=>x.game/x.model).filter(x=>x>0&&isFinite(x)).sort((a,c)=>a-c);return L.length?L[Math.floor(L.length/2)]:null;}
function myPowerFor(b,team){const g=(b.myPowers||{})[tsig(team)];if(g)return {p:+g,src:'game'};const k=powerK();return k?{p:k*myModelP(team),src:'est'}:null;}
function fmtPow(n){n=+n||0;return n>=1e9?(n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B':n>=1e6?(n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':n>=1e3?(n/1e3).toFixed(1).replace(/\.?0+$/,'')+'K':String(Math.round(n));}
function battlePlan(b){const enemy=(b.enemy||[]).map((e,i)=>e&&e.id&&H[e.id]?{...e,slot:i}:null).filter(Boolean);if(!enemy.length)return null;
  const calFor=team=>{if(!+b.enPower)return null;const m=myPowerFor(b,team);return m?{my:m.p,en:+b.enPower,src:m.src}:null;};
  const pool=allowedFor(b).map(id=>({id,v:statMult(S.heroes[id])*(TF[tierOf(id,'pvp')]??.7)})).sort((a,b2)=>b2.v-a.v).slice(0,13).map(x=>x.id);
  if(!pool.length)return {enemy,teams:[],none:true};const k=Math.min(+b.size||5,pool.length);const res=[];const minL=+b.minLevel||0;
  const tried=new Set((b.attempts||[]).filter(a=>!a.won&&!upgradedSince(a).length).map(a=>tsig(a.team))); /* only skipped while nothing in it has been upgraded */
  const rec=(start,cur)=>{if(cur.length===k){if(minL&&!cur.some(id=>(+S.heroes[id].level||0)>minL))return;const c=calFor(cur);const ev=battleEval(cur,enemy,c);res.push({team:[...cur],...ev,cal:c});return;}for(let i=start;i<pool.length;i++){cur.push(pool[i]);rec(i+1,cur);cur.pop();}};rec(0,[]);
  res.sort((a,c)=>c.R-a.R);const seen=[];const out=[];
  for(const r of res){if(out.length>=3)break;if(tried.has(tsig(r.team)))continue;if(out.some(o=>o.team.filter(x=>r.team.includes(x)).length>=4))continue;out.push(r);}
  const lost=res.filter(r=>tried.has(tsig(r.team)));
  return {enemy,teams:out,lost,pool,enPower:+b.enPower||0};}
function battleWhy(team,enemy){const out=[];const enIds=enemy.map(e=>e.id);
  const adv=team.filter(id=>enIds.some(e=>BEATS[H[id].faction]===H[e].faction)).length,dis=enIds.filter(e=>team.some(id=>BEATS[H[e].faction]===H[id].faction)).length;
  if(adv)out.push(`${adv} of your heroes deal +20% to at least one enemy (faction advantage).`);if(dis)out.push(`${dis} of theirs deal +20% to some of yours.`);
  team.forEach(id=>textEdge(id,enIds).why.forEach(w=>out.push(w+'.')));
  const enHeal=enIds.filter(e=>/heal/.test(skillText(e))&&H[e].role!=='Attacker');if(enHeal.length)out.push(`They have healing (${enHeal.map(e=>short(H[e].name)).join(', ')}): Flaxan Stun Device stuns and burns enemies when they're healed.`);
  const enBack=enemy.filter(e=>e.slot>=3&&H[e.id].role==='Attacker').map(e=>short(H[e.id].name));const reach=team.filter(id=>/farthest|furthest|flying through|dash/.test(skillText(id)));
  if(enBack.length)out.push(`Their back row has damage dealers (${enBack.join(', ')})${reach.length?`: ${reach.map(id=>short(H[id].name)).join(', ')} can reach the back row`:''}.`);
  return out;}
function verdict(R){return R>=1.3?['Likely win','go']:R>=0.9?['Close fight','wait']:['Unlikely','alert'];}
function battleLossAdvice(b,plan,last){const tips=[];const up=upgradedSince(last);const lc=(()=>{if(!+b.enPower)return null;const m=myPowerFor(b,last.team);return m?{my:m.p,en:+b.enPower,src:m.src}:null;})();
  tips.push(up.length?`You've upgraded ${up.map(x=>short(H[x].name)).join(', ')} since, so this team is back in the list - worth another go.`:'This team is skipped until you upgrade one of its heroes (level, rank, skills or artifact) - then it comes back.');const ev=battleEval(last.team,plan.enemy,lc);
  if(plan.teams[0])tips.push(plan.teams[0].R>=ev.R?`Try the next team below - it's rated higher (${plan.teams[0].R.toFixed(2)} vs ${ev.R.toFixed(2)}).`:`The next team below is rated a little lower (${plan.teams[0].R.toFixed(2)} vs ${ev.R.toFixed(2)}) but it's a different mix, and the rating can't see every skill interaction - worth one try.`);
  if(!lc)tips.push(+b.enPower?'Type the power the game showed for this team into its box: the app then knows how far apart you really were, gear and artifacts included.':'Enter their team power (and your team\'s, in the team\'s box): the app then knows how far apart you really are, gear and artifacts included.');
  else if(lc.my<lc.en*0.95){const gap=Math.round((1-lc.my/lc.en)*100);const up=last.team.map(id=>({id,u:S.heroes[id]})).filter(x=>(+x.u.level||0)<levelCap(x.u)-1).sort((a,c)=>(+a.u.level)-(+c.u.level)).slice(0,2);
    tips.push(`You're about ${gap}% below their power.${up.length?' Cheapest gains: level '+up.map(x=>short(H[x.id].name)+' ('+x.u.level+'/'+levelCap(x.u)+')').join(' and ')+'.':' Your team is at its level caps - rank-ups, skills (Home) and artifact levels are next.'}`);}
  const st=(b.name||'').match(/(\d+)\s*[-–]\s*(\d+)/);if(st&&+st[2]%5===0)tips.push(`Stage ${st[2]} is a multiple of 5 - a boss wave. Players call these "power walls": the matchup matters more than raw power, so trying a different team is usually better than grinding.`);
  {const enIds=plan.enemy.map(e=>e.id);const byF={};last.team.forEach(id=>{const f=H[id].faction;const n=enIds.filter(e=>BEATS[H[e].faction]===f).length;if(n)byF[f]={n,c:(byF[f]?.c||0)+1};});
   const worst=Object.entries(byF).sort((a,c)=>c[1].n*c[1].c-a[1].n*a[1].c)[0];if(worst&&worst[1].n>=2&&worst[1].c>=2){const beaters=[...new Set(enIds.filter(e=>BEATS[H[e].faction]===worst[0]).map(e=>H[e].faction))];tips.push(`${worst[1].n} of their heroes (${beaters.join('/')}) deal +20% to your ${worst[1].c} ${worst[0]} heroes - swapping one or two of those out removes that edge.`);}}
  tips.push('Positions: if their main damage dealer is on one side, try putting your toughest hero opposite it. This is a test, not a sure thing - log the result either way.');
  return tips;}

function setStep(key,v){if(key==='raidsize'){S.settings.raidSize=v;save();render();return;}if(key.startsWith('art:')){const n=key.slice(4);if(v>0)S.artifacts[n]={level:v};else{delete S.artifacts[n];Object.values(S.heroes).forEach(u=>{if(norm(u.artifact)===norm(n))u.artifact='';});}}if(key.startsWith('tot:')){const n=key.slice(4);if(v>0)S.totems[n]={level:v};else delete S.totems[n];}save();}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='rq'){sub.rq=t.value;clearTimeout(t._d);t._d=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.getElementById('rq');n.focus();n.setSelectionRange(pos,pos);},250);}
  if(t.id==='dq'){sub.dq=t.value;clearTimeout(t._d);t._d=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.getElementById('dq');n.focus();n.setSelectionRange(pos,pos);},250);}
  if(t.id==='addq')addList(t.value);
  if(t.id==='hLevel'||t.id==='hStars')updCap();
  if(t.dataset.stepin!==undefined){t.value=t.value.replace(/[^\d]/g,'');}
  if(t.id&&t.id.startsWith('wv-'))t.value=t.value.replace(/[^\d]/g,'');
  if(t.dataset.p!==undefined&&t.dataset.p==='level')t.value=t.value.replace(/[^\d]/g,'');
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.closest&&t.closest('#hEdit,#sheet')&&sub.hero&&(['hOwn','hRank','hStars','hLevel','hCount','hArt','hArtLv','hTot'].includes(t.id)||t.dataset.sk!==undefined||t.dataset.ov!==undefined)){if(t.id==='hLevel'){fitRankToLevel();updCap();}if(t.id==='hRank')updCap();saveHero(false);if(t.id==='hOwn')document.getElementById('hEdit').style.display=t.checked?'':'none';return;}
  if(t.id==='hOwn'){document.getElementById('hEdit').style.display=t.checked?'':'none';}
  if(t.id==='hRank'){updCap();}
  if(t.dataset.bp!==undefined){const b=S.battles[sub.bi??S.battles.length-1];if(!b)return;const v=parseAmt(t.value);if(v===null){toast('Use a number like 1.25M or 1250000');return;}b.myPowers=b.myPowers||{};const sig=t.dataset.bp;
    if(v===''){delete b.myPowers[sig];}else{b.myPowers[sig]=v;const team=sig.split(',');S.powerCal=(S.powerCal||[]).filter(x=>x.sig!==sig);S.powerCal.push({sig,game:v,model:myModelP(team),d:Date.now()});if(S.powerCal.length>30)S.powerCal.shift();}
    save();render();return;}
  if(t.dataset.be!==undefined||t.dataset.bl!==undefined||t.dataset.bf!==undefined||t.dataset.brl!==undefined){const b=S.battles[sub.bi??S.battles.length-1];if(!b)return;
    if(t.dataset.be!==undefined){const i=+t.dataset.be;b.enemy=b.enemy||[null,null,null,null,null];b.enemy[i]=t.value?{id:t.value,level:(b.enemy[i]||{}).level||''}:null;}
    if(t.dataset.bl!==undefined){const i=+t.dataset.bl;b.enemy=b.enemy||[null,null,null,null,null];if(b.enemy[i])b.enemy[i].level=parseInt(t.value)||'';}
    if(t.dataset.bf!==undefined){const k=t.dataset.bf;b[k]=k==='name'?t.value.trim():(parseAmt(t.value)??'');}
    if(t.dataset.brl!==undefined&&t.value){b.restrict=b.restrict||{};const L=b.restrict[t.dataset.brl]=b.restrict[t.dataset.brl]||[];if(!L.includes(t.value))L.push(t.value);}
    save();render();return;}
  if(t.id==='bkFile'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||typeof v!=='object'||!v.heroes)throw 0;S=merge(v);save();render();toast('Backup restored');}catch(err){toast('That file is not a GTG Advisor backup');}};r.readAsText(t.files[0]);t.value='';return;}
  if(t.id==='tierMode'){S.settings.tierMode=t.value;save();render();}
  if(t.id==='rsort'){sub.rs=t.value;S.settings.rosterSort=t.value;save();render();}
  if(t.id==='enemy'){S.settings.enemy=t.value;save();render();}
  if(t.id==='dt'){sub.dt=t.value;render();}
  if(t.dataset.stepin!==undefined){const v=Math.max(+t.dataset.min,Math.min(+t.dataset.max,+t.value||0));t.value=v;setStep(t.dataset.stepin,v);}
  if(t.dataset.p!==undefined){S.player[t.dataset.p]=t.value.trim();save();renderHeader();}
  if(t.dataset.r!==undefined){const v=parseAmt(t.value);if(v===null){toast('Use a number like 1.8B or 950');t.value=S.resources[t.dataset.r]===''?'':fmt(S.resources[t.dataset.r]);return;}S.resources[t.dataset.r]=v;t.value=v===''?'':fmt(v);save();renderHeader();}
});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.id&&t.id.startsWith('wv-')){e.preventDefault();t.blur();logWaves(t.id.slice(3));}});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault();},{passive:false});
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(x=>x[0]===h)&&h!==tab){tab=h;render();}});
(function(){const h=location.hash.slice(1);if(TABS.some(x=>x[0]===h))tab=h;})();
render();initStore();
</script>
</body>
</html>
