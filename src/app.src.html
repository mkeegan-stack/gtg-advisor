<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#18214f">
<title>GTG Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground-1:#1a2558;--ground-2:#21388f;--ground-3:#1c2f78;
  --bar:#18214f;--bar-2:#152259;--panel:#2d55c4;--panel-2:#2443a6;--panel-3:#1d2c6e;
  --line:#8fb6ff;--line-soft:#4d79e6;--ink:#fff;--ink-2:#dbe6ff;--ink-3:#a9c1ff;
  --gold:#ffd21f;--pink:#ff2d8a;--mint:#2fe08a;--mint-ink:#0f2a1c;--chip:#e8eefc;
  --s:#c21f5b;--a:#2b6fd6;--b:#4a5a8a;--c:#7a5a9a;--f:#6b6b6b;
  --wb:linear-gradient(160deg,#1f8a6e,#0f4f4a);--ed:linear-gradient(160deg,#e0a91c,#a8700a);
  --gda:linear-gradient(160deg,#2f6fe0,#1b3c9a);--cr:linear-gradient(160deg,#c23a7a,#6e1f4f);
  --cut:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip}
body{font-family:'Rubik',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--ground-1) 0%,var(--ground-2) 55%,var(--ground-3) 100%) fixed;min-height:100vh;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,select,textarea{user-select:text;-webkit-user-select:text;font-size:16px!important}
html,body,*{touch-action:manipulation}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}
.d{font-family:'Saira Condensed',sans-serif;font-weight:800;letter-spacing:.2px}
button{font:inherit;color:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--bar);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-soft)}
.ring{width:48px;height:48px;border-radius:50%;border:3px solid #3f8cff;display:grid;place-items:center;text-align:center;line-height:1;flex:none}
.ring small{display:block;font-size:9px;color:var(--ink-3)}
.ring b{font-family:'Saira Condensed';font-weight:800;font-size:19px}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.pill{background:var(--chip);color:var(--ground-1);font-weight:700;font-size:11px;padding:3px 7px;transform:skewX(-10deg)}
.pill span{display:inline-block;transform:skewX(10deg)}
.title-row{flex:1;min-width:0}
.title-row .d{font-size:17px;line-height:1.1}
main{padding:12px 14px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.band{background:var(--panel-2);margin:-12px -14px 12px;padding:10px 16px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.band h1{margin:0;font-family:'Saira Condensed';font-weight:800;font-size:26px;line-height:1}
.band .sub{font-size:10px;color:var(--ink-3);letter-spacing:1px;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);padding:11px 12px;clip-path:var(--cut);position:relative;margin-bottom:10px}
.card h3{margin:0;font-family:'Saira Condensed';font-weight:800;font-size:18px;line-height:1.1;text-transform:uppercase}
.card .rule{width:44px;height:2px;background:var(--line);margin:4px 0 6px}
.card p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.4}
.card .dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--pink)}
.kicker{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.sec{font-family:'Saira Condensed';font-weight:800;font-size:19px;margin:16px 0 8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec small{font-family:'Rubik';font-weight:500;font-size:11px;color:var(--ink-3);text-transform:none}
.cta{display:block;width:100%;background:var(--mint);color:var(--mint-ink);border:0;font-family:'Saira Condensed';font-weight:800;font-size:18px;padding:11px;border-radius:10px;text-align:center;text-decoration:none}
.btn{background:var(--panel-2);border:1px solid var(--line-soft);color:#fff;padding:8px 12px;font-size:13px;font-weight:600;border-radius:8px}
.btn.gold{background:var(--gold);color:#1a2558;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.small{padding:5px 9px;font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-3)}
.tiny{font-size:11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -14px 4px;padding-left:14px;padding-right:14px}
.chipbtn{flex:none;background:var(--panel-2);border:0;font-size:12px;padding:6px 10px;color:#fff;white-space:nowrap}
.chipbtn.on{background:#3aa7ff;color:#0e1c4d;font-weight:700}
.stick{position:sticky;top:var(--hdrH,64px);z-index:15;background:var(--bg,#1d2a6b);margin:0 -14px;padding:8px 14px 6px;box-shadow:0 6px 10px -8px rgba(0,0,0,.5)}
.srch{position:relative;flex:1;min-width:0}.srch input{width:100%;padding:8px 30px 8px 10px!important}.srch .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--line);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.seg{display:flex;border:1px solid var(--line);flex:none}.seg button{padding:7px 9px;font-size:13px;color:var(--ink-2)}.seg button.on{background:var(--accent,#3aa8ff);color:#0b1640;font-weight:700}
.letter{grid-column:1/-1;font-family:'Saira Condensed';font-weight:800;font-size:15px;color:var(--ink-2);border-bottom:1px solid var(--line-soft);padding:6px 0 2px;margin-top:4px}
.hlist{display:flex;flex-direction:column;gap:4px}.hrow{display:grid;grid-template-columns:6px 1fr auto auto;gap:10px;align-items:center;padding:8px 10px 8px 0;background:var(--panel-2);text-align:left;width:100%;border:1px solid var(--line-soft)}
.hrow .bar{display:block;align-self:stretch;width:6px;min-height:100%}.hrow .bar.WB{background:#2f6fe0}.hrow .bar.ED{background:#d9a422}.hrow .bar.GDA{background:#1f9a6b}.hrow .bar.CR{background:#c2357a}
.hrow .n{font-weight:700;color:#fff;font-size:15px;line-height:1.15}.hrow .m{font-size:12px;color:var(--ink-3)}.hrow .lv{text-align:right;font-family:'Saira Condensed';font-weight:800;font-size:17px;color:#fff;line-height:1}.hrow .lv small{display:block;font-family:inherit;font-size:11px;color:var(--gold,#ffd54a);font-weight:700}.hrow.off{opacity:.45}
.opjump{display:flex;gap:6px;overflow-x:auto}.opjump button{flex:none;padding:6px 10px;font-size:13px;border:1px solid var(--line);color:#fff;background:var(--panel-2);position:relative}.opjump button .d{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#e8476a}
.opsum{font-size:13px;color:var(--ink-2);margin-top:4px}.opcard>summary{list-style:none;cursor:pointer}.opcard>summary::-webkit-details-marker{display:none}.opcard>summary .chev{float:right;font-size:18px;color:var(--ink-3);transition:transform .15s}.opcard[open]>summary .chev{transform:rotate(90deg)}
.hsec{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 6px;font-family:'Saira Condensed';font-weight:800;font-size:18px;color:#fff;text-transform:uppercase;letter-spacing:.5px}.hsec small{font-family:inherit;font-size:12px;color:var(--ink-3);font-weight:600;text-transform:none;letter-spacing:0}
.card.compact{padding-top:10px;padding-bottom:10px}.card.compact h3{font-size:19px}.card.compact p{font-size:14px}
.sheetnav{display:flex;gap:6px;margin-bottom:6px}.sheetnav button{flex:1;padding:7px;border:1px solid var(--line);color:var(--ink-2);font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(min-width:560px){.grid4{grid-template-columns:repeat(6,minmax(0,1fr))}}
.grid5{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.tile{position:relative;height:118px;display:flex;flex-direction:column;overflow:hidden;clip-path:var(--cut);border:2px solid #dfe8ff;background:var(--gda);padding:0;text-align:left}
.tile.WB{background:var(--wb)}.tile.ED{background:var(--ed)}.tile.GDA{background:var(--gda)}.tile.CR{background:var(--cr)}
.tile.off{opacity:.38;filter:saturate(.4)}
.tile .tier{position:absolute;top:0;left:0;color:#fff;font-family:'Saira Condensed';font-weight:800;font-size:13px;padding:1px 6px;background:var(--b)}
.tier.S{background:var(--s)}.tier.A{background:var(--a)}.tier.B{background:var(--b)}.tier.C{background:var(--c)}.tier.F{background:var(--f)}
.tile .glyph{flex:1;display:grid;place-items:center;padding-top:10px}
.tile .glyph svg{width:30px;height:30px}
.tile .nm{font-family:'Saira Condensed';font-weight:800;font-size:12.5px;line-height:1.02;color:#fff;padding:0 5px 3px;text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.35);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}.tile .nm.long{font-size:11px}.tile .nm.xl{font-size:10px;letter-spacing:-.2px}
.tile .strip{background:rgba(14,22,60,.88);display:flex;justify-content:space-between;padding:2px 5px;font-size:11px;font-weight:700;min-height:18px}
.tile .strip .st{color:var(--gold)}
.tile .fdot{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.fdot.WB{background:#3fe0b0}.fdot.ED{background:#ffd21f}.fdot.GDA{background:#7fb4ff}.fdot.CR{background:#ff7fc0}
.mini{height:96px}
.mini .glyph svg{width:26px;height:26px}
.mini .nm{font-size:11px;word-break:normal;overflow-wrap:normal;hyphens:none}.mini .strip{font-size:10px}.mini .strip .rk{display:none}
.empty-slot{border:2px dashed var(--line);background:rgba(255,255,255,.05);height:96px;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--ink-3);clip-path:var(--cut);padding:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar-2);padding:8px 6px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;border-top:1px solid var(--line-soft)}
nav.tabs button{background:var(--panel-2);border:0;border-top:4px solid transparent;color:var(--ink-3);padding:11px 0 8px;font-family:'Saira Condensed';font-weight:700;font-size:13px;transform:skewX(-8deg)}
nav.tabs button span{display:inline-block;transform:skewX(8deg)}
nav.tabs button.on{color:var(--gold);border-top-color:var(--gold)}
.list{display:flex;flex-direction:column;gap:6px}
.li{background:var(--panel-3);border-left:3px solid var(--line-soft);padding:9px 10px;font-size:13px}
.li b{font-weight:700}
.tag{display:inline-block;font-size:10.5px;padding:2px 6px;background:rgba(255,255,255,.12);margin:2px 3px 0 0}
.tag.hl{background:var(--gold);color:#1a2558;font-weight:700}
.status{font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 6px;text-transform:uppercase}
.status.go{background:var(--mint);color:var(--mint-ink)}.status.wait{background:#ffb454;color:#3a2200}.status.info{background:#7fb4ff;color:#0e1c4d}.status.alert{background:var(--pink);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th,table.t td{text-align:left;padding:6px 6px;border-bottom:1px solid rgba(143,182,255,.25);vertical-align:top}
table.t th{color:var(--ink-3);font-weight:600}
.tbox{overflow-x:auto;background:var(--panel-3);padding:4px 6px;margin-bottom:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,30,.6);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;z-index:51;background:var(--ground-1);border-top:3px solid var(--gold);padding:14px 14px calc(18px + env(safe-area-inset-bottom));display:none;max-width:760px;margin:0 auto}
.sheet.open,.sheet-bg.open{display:block}
.sheet .x{position:sticky;top:0;float:right;background:var(--panel-2);border:1px solid var(--line-soft);width:36px;height:36px;font-size:18px;z-index:2}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.in{background:#0f1a46;border:0;border-bottom:2px solid var(--line);color:#fff;padding:10px;font-size:16px;width:100%;border-radius:0}
select.in option{background:#0f1a46;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper{display:flex;align-items:stretch}
.stepper button{width:34px;background:var(--panel-2);border:0;font-size:18px}
.stepper input{text-align:center;padding:8px 2px}
.note{font-size:11px;color:var(--ink-3);margin-top:3px}
.hint{background:rgba(255,210,31,.12);border-left:3px solid var(--gold);padding:8px 10px;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.err{position:fixed;left:10px;right:10px;top:calc(70px + env(safe-area-inset-top));z-index:60;background:#5a0f2c;border:1px solid var(--pink);padding:10px;font-size:13px;display:none}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0e1c4d;border:1px solid var(--gold);padding:8px 14px;font-size:13px;z-index:70;display:none;max-width:90vw}
.cycle{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:12px}
.fpill{padding:6px 8px;text-align:center;font-weight:700;color:#fff;clip-path:var(--cut)}
.fpill.WB{background:var(--wb)}.fpill.ED{background:var(--ed)}.fpill.GDA{background:var(--gda)}.fpill.CR{background:var(--cr)}
.search{position:relative;margin-bottom:8px}
details{background:var(--panel-3);margin-bottom:6px}
details summary{padding:9px 10px;font-weight:600;font-size:13px;list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details>div{padding:0 10px 10px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
footer{text-align:center;font-size:10px;color:var(--ink-3);margin-top:22px;line-height:1.5}
.formation{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center}
.pslot{position:relative;touch-action:none;-webkit-user-select:none;user-select:none}.pslot.sel .tile{outline:3px solid var(--gold,#ffd54a);outline-offset:1px}.pslot.over .tile,.pslot.over .pempty{outline:3px dashed var(--gold,#ffd54a)}.prm{position:absolute;top:-6px;right:-4px;width:24px;height:24px;border-radius:50%;background:#e8476a;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700;z-index:2}.dragghost{position:fixed;pointer-events:none;z-index:9999;opacity:.85;transform:translate(-50%,-50%) scale(1.05)}
.pitch{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}.pcell{display:flex;flex-direction:column;gap:3px;min-width:0}.pcell .tile{width:100%}.plbl{font-size:9px;color:var(--ink-3);text-align:center;letter-spacing:.5px;text-transform:uppercase}.pempty{border:1px dashed var(--line);min-height:60px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-3)}.bsel,.blv{padding:6px 4px!important;font-size:16px}.blv{text-align:center}
.formation .lbl{font-size:10px;color:var(--ink-3);writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;letter-spacing:1px}
.score{font-family:'Saira Condensed';font-weight:800;font-size:22px;color:var(--gold)}
.bar{height:6px;background:rgba(255,255,255,.15)}.bar i{display:block;height:100%;background:var(--gold)}
</style>
</head>
<body>
<header class="top">
  <div class="ring"><div><small>Lvl</small><b id="hdrLvl">—</b></div></div>
  <div class="title-row">
    <div class="d" id="hdrName">GTG ADVISOR</div>
    <div class="pills" id="hdrPills"></div>
  </div>
</header>
<div class="err" id="err"></div>
<main id="view"></main>
<nav class="tabs" id="tabs"></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script id="game-data" type="application/json">/*__DATA__*/</script>
<script>
"use strict";
const APP_VERSION='Version 7 Nov 2026';
const G=JSON.parse(document.getElementById('game-data').textContent);
/* ops in the same order as the game's GDA Ops screen */
{const ORD=['turn-up-the-heat','train-and-gain','downtown-destruction','guardians-of-the-globe','reanimen-rampage','this-is-heavy','everyone-whos-anyone','schools-out','well-done'];G.ops.sort((a,b)=>(ORD.indexOf(a.id)+1||99)-(ORD.indexOf(b.id)+1||99));}
const H={};G.heroes.forEach(h=>H[h.id]=h);
const ART={};G.artifacts.forEach(a=>ART[a.name]=a);
const FKEY={'Worlds Beyond':'WB',"Earth's Defenders":'ED','GDA':'GDA','Criminals':'CR'};
const FBEATS={};G.mechanics.factionCycle.forEach(([a,b])=>FBEATS[a]=b);
const TIERW={S:1,A:.8,B:.6,C:.45,F:.25,'?':.5,'':.5};
const RANKS=G.rankTable.map(r=>r.rank); // 30 ranks, index 0 = Common
const MODES={pvp:'PvP / Arena',ops:'GDA Ops',raid:'Boss Raid'};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const fmt=n=>{n=+n||0;if(n>=1e9)return(n/1e9).toFixed(n>=1e10?0:1)+'B';if(n>=1e6)return(n/1e6).toFixed(n>=1e7?0:1)+'M';if(n>=1e3)return(n/1e3).toFixed(n>=1e4?0:1)+'K';return String(Math.round(n));};
const short=n=>String(n).replace(/ \((Grand Regent|Viltrum Empire)\)$/,'').replace('Mauler Twin (Definitely Not The Clone)','Mauler Twin (Ranged)').replace('Mauler Twin (The Original, Of Course)','Mauler Twin (Melee)').replace('Capevincible (Sinister Mark)','Capevincible').replace('Darkwing 2 (FKA Nightboy)','Darkwing 2').replace('Invincible (Black & Blue Suit)','Invincible Blue').replace('Damien Darkblood (Under Realm)','Darkblood (Under Realm)').replace('Lizard League Soldier','Lizard Soldier');
function artByName(n){if(!n)return null;if(ART[n])return ART[n];const k=norm(n);return G.artifacts.find(a=>norm(a.name)===k)||G.artifacts.find(a=>norm(a.name).includes(k)||k.includes(norm(a.name)))||null;}

/* ---------------- state + storage ---------------- */
const BLANK=()=>({v:1,player:{level:'',name:''},resources:{gems:'',chips:'',blueXP:'',pinkXP:'',me:'',sme:'',artXPc:'',artXPr:'',artXPs:'',dossiers:''},heroes:{},artifacts:{},totems:{},overrides:{},teams:{},waves:{},battles:[],powerCal:[],swapLog:[],settings:{tierMode:'pvp',enemy:''},updated:0});
let S=BLANK();
let db=null, saveTimer=null, dbOk=false, loaded=false;
const LS_KEY='gtg-advisor-state';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null');}catch(e){return null;}}
function lsSet(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v));}catch(e){}}
function merge(x){const b=BLANK();if(!x||typeof x!=='object')return b;x=JSON.parse(JSON.stringify(x)); /* cloud data arrives frozen: copy it so it can be edited */for(const k of Object.keys(b)){if(x[k]!==undefined)b[k]=(typeof b[k]==='object'&&!Array.isArray(b[k]))?Object.assign(b[k],x[k]):x[k];}const R=G.artifactRenames||{};Object.keys(R).forEach(o=>{if(b.artifacts[o]){b.artifacts[R[o]]=b.artifacts[o];delete b.artifacts[o];}});Object.values(b.heroes).forEach(u=>{if(u&&R[u.artifact])u.artifact=R[u.artifact];});return b;}
function save(){S.updated=Date.now();lsSet(S);clearTimeout(saveTimer);saveTimer=setTimeout(pushDb,700);}
let writing=false,again=false;
async function pushDb(){if(!db)return;if(writing){again=true;return;}writing=true;try{await db.doc('state/main').set(JSON.parse(JSON.stringify(S)));dbOk=true;}catch(e){dbOk=false;toast('Saved on this device only ('+(e&&e.code||'offline')+')');}writing=false;if(again){again=false;pushDb();}}
async function initStore(){
  const local=lsGet(); if(local){S=merge(local);}
  loaded=true; render();
  try{
    if(!window.claude||!window.claude.use)return;
    const d=await window.claude.use('db'); if(!d)return; db=d;
    const timer=new Promise(r=>setTimeout(()=>r('timeout'),10000));

/* ---------------- helpers on heroes ---------------- */
function rankIndex(name){const i=RANKS.indexOf(name);return i<0?0:i;}

/* ---------------- engine: hero value ---------------- */
/* Investment is measured against your own top heroes: level / average level of your 5 highest. (★ levels are already in the level.) */
function maxMult(){const l=owned().map(id=>+S.heroes[id].level||1).sort((a,b)=>b-a).slice(0,5);return l.length?l.reduce((a,b)=>a+b,0)/l.length:1;}

function skillFactor(id){const u=S.heroes[id];const sk=(u.skills||[]);const h=H[id];let n=0,t=0;h.skills.forEach((s,i)=>{if(skillUnlocked(u,i)){n++;t+=Math.min(15,+sk[i]||1);}});return n?t/(n*15):0;}

const TF={S:1,A:.88,B:.76,C:.64,F:.45,'?':.7,'':.7};
let _pref=null,_prefKey='';

/* tag synergy: scan unlocked skill text for "<tag> ally/allies" */
const TAGFORMS=[['Viltrumites',['viltrumite']],['Human',['human']],['Beast',['beast']],['Coalition of Planets',['coalition of planets']],['Subsoil',['subsoil']],['Mauler',['mauler']],['Flaxans',['flaxan']],['Invaders',['invader']],['Leader',['leader']],['The Guardians of the Globe',['guardian of the globe','guardians of the globe']],['The Original Guardians of the Globe',['original guardian']],['Lizard League',['lizard league']],['Duality',['duality']],['Teen Team',['teen team']],['Last Line of Defense',['last line of defense']],['Not of this Earth',['not of this earth']],['Technologist',['technologist']],['Malefactors',['malefactor']],['Anti-Hero',['anti-hero']],['Multiversal',['multiversal']],["Cecil's Secrets",["cecil's secret"]],['The Order',['the order']],['Flying',['flying']],['Grounded',['grounded']],['Armed',['armed']],['Ranged',['ranged']],['Melee',['melee']]];

function factionBonus(team){const c={};team.forEach(id=>{const f=H[id].faction;c[f]=(c[f]||0)+1;});const v=Object.values(c).sort((a,b)=>b-a);const tb=G.mechanics.teamBonus;
  let key=null;if(v[0]>=2){key=String(Math.min(5,v[0]));if((v[0]===2||v[0]===3)&&v[1]===2)key=v[0]+'+2';}
  const pct={'2':3,'3':8,'4':17,'5':24,'2+2':14.5,'3+2':20}[key]||0;return {key,text:key?tb[key]:'none',pct};}
function teamScore(team,mode,opts={}){const mm=opts.mm||maxMult();let base=0;const det=[];
  team.forEach(id=>{let v=heroValue(id,mode,mm);
    if(mode==='pvp'&&opts.enemy){const f=H[id].faction;if(FBEATS[f]===opts.enemy)v*=1.12;else if(FBEATS[opts.enemy]===f)v*=0.9;}

  let syn=0;const synList=[];
  team.forEach(id=>{const u=S.heroes[id];synergyTags(id).forEach(s=>{if(!skillUnlocked(u,s.skill))return;const n=team.filter(o=>o!==id&&(H[o].tags||[]).includes(s.tag)).length;if(n>0){const add=Math.min(0.12,0.03*n);syn+=add;synList.push(`${short(H[id].name)} ← ${n} ${s.tag}`);}});});

  let compBonus=0,compName='';G.comps.filter(c=>c.mode===(mode==='raid'?'pvp':mode)).forEach(c=>{const hit=c.heroes.filter(x=>team.includes(x)).length;const b=hit>=5?.06:hit>=4?.04:hit>=3?.02:0;if(b>compBonus){compBonus=b;compName=c.name;}});

function bestTeams(mode,opts={}){const ids=owned();if(ids.length===0)return [];const mm=maxMult();

  res.sort((a,b)=>b.score-a.score);const out=[];for(const r of res){if(out.length>=(opts.n||3))break;if(out.some(o=>o.team.filter(x=>r.team.includes(x)).length>=4))continue;out.push(r);}return out;}
/* The game has 3 front slots and 2 back slots. Front: defenders, then melee attackers, then others; back: supports and ranged. */
function formation(team){const rank=id=>{const h=H[id];return h.role==='Defender'?0:(h.role==='Attacker'&&h.attackType==='Melee')?1:h.role==='Attacker'?2:h.attackType==='Melee'?3:4;};

/* ---------------- engine: artifacts ---------------- */
const ROLE_ARTS={Attacker:['GDA Cloaking Device',"Mark Grayson's Earpiece",'GDA Mines','Neural-Link Chip',"Ragnar's Claw",'Sinlak Beetle Dart','Kanzlok','Martian Spear','Flaxan Anti-Aging Bracelet','Body Enhancement','Coalition of Planets Badge'],

function synFit(a,id,team){const y=a.syn;if(!y)return 0.3;const h=H[id];

  if(y.teamTags&&!y.teamTags.every(t=>team.filter(x=>(H[x].tags||[]).some(g=>g.includes(t))).length>=2))return 0.15;
  return 0.55;}
function artBacking(n,id){const a=artByName(n);if(!a)return null;const oi=(a.owners||[]).indexOf(id);if(oi===0)return 'first';if(oi>0)return 'players';
  if((H[id].artifacts||[]).some(r=>norm(r.name)===norm(a.name)))return 'hub';if((a.guide||[]).includes(id))return 'guide';return null;}

  if(n.includes('coalitionofplanetsbadge')){const c=team.filter(x=>x!==id&&(H[x].tags||[]).includes('Coalition of Planets')).length;s*=c>=2?1.3:c===1?1:0.5;}
  if(n.includes('bodyenhancement')||n.includes('guardiansoftheglobebracelet')||n.includes('spydrone')){const c=team.filter(x=>(H[x].tags||[]).some(t=>/Guardians of the Globe/.test(t))).length;s*=c>=3?1.25:c>=1?0.8:0.3;}

  if(a.owners){const oi=a.owners.indexOf(id);
    if(oi>=0&&(h.keepBase||devRatio(id)>=0.6))s=Math.max(s,[1.8,1.2,1.1,1.0,0.95][Math.min(oi,4)]);
    else if(oi<0&&ri<0&&gi<0&&a.owners.some(o=>S.heroes[o]&&S.heroes[o].owned&&['S','A'].some(t=>['pvp','ops','raid'].some(m=>tierOf(o,m)===t))))s*=0.25;}

/* An artifact's ability improves in steps at 10, 20 and 30; after 30 only its stats grow.

let _plan=null,_planKey='';
function artifactPlan(){const key=JSON.stringify([S.heroes,S.artifacts,S.overrides,S.settings.enemy,S.teams,S.settings.opsRun]);if(_plan&&_planKey===key)return _plan;
  const teams=[['pvp',bestTeams('pvp',{n:1,enemy:S.settings.enemy})[0]],['ops',bestTeams('ops',{n:1})[0]],['raid',{team:raidSquad().squad.slice(0,5)}]].filter(x=>x[1]);
  const home={};const add=(m,team)=>team.forEach(id=>{if(H[id]&&S.heroes[id]&&S.heroes[id].owned&&!home[id])home[id]={m,team};});
  /* your own teams first: PvP, then the ops you run (highest priority first), then the advisor's best teams */
  const T=S.teams||{};if(T.pvp)add('pvp',myTeam('pvp'));
  const pr={high:0,medium:1,low:2};opsRun().slice().sort((a,b)=>(pr[a.priority]??3)-(pr[b.priority]??3)).forEach(o=>add('ops',myTeam(o.id)));

  teams.forEach(([m,t])=>add(m,t.team));
  /* heroes you actually use always count; anyone else only if they're built up (no artifacts on a level-220 Brit) */
  Object.keys(home).forEach(id=>{if(!used.has(id)&&!H[id].keepBase&&devRatio(id)<0.6)delete home[id];});
  owned().forEach(id=>{if(home[id]||(!H[id].keepBase&&devRatio(id)<0.6))return;const m=['pvp','ops','raid'].find(m=>tierOf(id,m)==='S');if(m)home[id]={m,team:[id],extra:true};});
  const pvpT=(teams.find(x=>x[0]==='pvp')||[])[1],raidT=(teams.find(x=>x[0]==='raid')||[])[1];
  const impOf={};Object.keys(home).forEach(id=>{impOf[id]=used.has(id)?heroImportance(id,pvpT&&pvpT.team,raidT&&raidT.team).v:0.6;});
  /* heroes that barely matter to you (fillers in low-priority ops) don't compete for artifacts */

  const mm=maxMult();const done={};let arts=ownedArts();
  /* a built hero already holding his players' first-pick artifact keeps it */
  Object.keys(home).forEach(id=>{const cur=S.heroes[id].artifact;const a=artByName(cur);if(a&&arts.includes(a.name)&&a.owners&&a.owners[0]===id){done[id]=a.name;arts=arts.filter(n=>n!==a.name);}});

    const asg=bestAssignment(M);asg.forEach((j,i)=>{if(j>=0&&M[i][j]>0)done[hs[i]]=arts[j];});const used=new Set(Object.values(done));arts=arts.filter(n=>!used.has(n));});

    const held=new Set(owned().filter(id=>!done[id]&&S.heroes[id].artifact&&(H[id].keepBase||inMyTeams(id))).map(id=>norm(S.heroes[id].artifact)));

/* Best overall hand-out of artifacts (Hungarian algorithm): one artifact per hero, maximising the total,

function bestAssignment(M){const n=M.length,m=M[0]?M[0].length:0;if(!n||!m)return [];const N=Math.max(n,m);

  const u=new Array(N+1).fill(0),v=new Array(N+1).fill(0),p=new Array(N+1).fill(0),way=new Array(N+1).fill(0);

/* ---------------- engine: skills & rank-ups ---------------- */
function skillReqLevel(slot,lvl){const key=['main','synergy','p1','p2'][slot];let req=0;for(const r of G.skillCosts){if(r.level>lvl)break;const m=String(r[key]||'').match(/(\d+)/);if(m)req=+m[1];}return req;}

const PRIOW={S:4,A:3,B:2,F:0,'?':2.5};

/* An ops team is judged on four things together:
   - what players run: overlap with the closest of the teams players use in this op (several per op);
   - meta: each hero's player rating for ops;

   - synergy: faction bonus + skills that boost allies with certain tags. */

/* Ops teams are judged as whole teams against the templates players run in that op:

    lvl:team.reduce((a,id)=>a+Math.min(1,devRatio(id,mm)),0)/Math.max(1,team.length),syn,fb,comp:[...best.t.core,...(best.t.flex||[]),...(best.t.sac||[])],tname:best.t.name,thin:!!best.t.thin,cov:best.cov,missing:(()=>{const rem=[...team];const take=x=>{const i=rem.indexOf(x);if(i<0)return false;rem.splice(i,1);return true;};const m=best.t.core.filter(x=>!take(x));(best.t.sac||[]).forEach(x=>{if(![x,...(best.t.sacAny||[])].some(take))m.push(x);});return m;})()};}

function whyBetter(a,b){const r=[];if(b.missing.length<a.missing.length&&b.tname===a.tname)r.push(`fills ${a.missing.length-b.missing.length>1?'slots':'a slot'} the players' "${b.tname}" team relies on`);if(b.tname!==a.tname||b.players>a.players)r.push(`closer to the players' "${b.tname}" team`);if(b.meta>a.meta+0.05)r.push('higher-rated for ops');if(b.lvl>a.lvl+0.05)r.push('more built-up heroes');if(b.syn+b.fb/200>a.syn+a.fb/200+0.02)r.push('better synergy');return r.join(', ')||'stronger overall';}
function opComp(o){return (o.comp||((o.hubComps.find(c=>c.stage==='best')||o.hubComps.find(c=>c.stage==='advanced')||o.hubComps[0]||{}).heroes)||[]).slice(0,5);}
/* players' comp for an op, using your heroes: a comp hero you've barely built is swapped for an alternative or your best ops hero */
function compPick(o,x,copies,mmx){const alts=[x,...((o.alts||{})[x]||[])].filter(a=>copies[a]>0&&S.heroes[a]);if(!alts.length)return null;
  if(alts.length===1)return alts[0];alts.sort((a,b)=>heroValue(b,'ops',mmx)-heroValue(a,'ops',mmx));return alts[0];}
function teamDiff(mine,sug){const a=[...mine],b=[...sug];const outs=[],ins=[];b.forEach(x=>{const i=a.indexOf(x);if(i>=0)a.splice(i,1);else ins.push(x);});outs.push(...a);return {ins,outs};}
function opsRun(){const all=G.ops.filter(o=>o.priority!=='event');const sel=S.settings.opsRun;return all.filter(o=>!sel||sel.includes(o.id));}
function opsRun(){const all=G.ops.filter(o=>o.priority!=='event');const sel=S.settings.opsRun;return all.filter(o=>!sel||sel.includes(o.id));}
function planOp(o,pool0,mine,mmx){let best=null;

  ts.forEach(t=>{const pool={...pool0};const pick=[];const size=Math.max(mine.length,Math.min(5,t.core.length+(t.sac||[]).length+(t.flex||[]).length),o.solo?1:0);

function opsGoals(o,final,mine,copies,mmx){const bd0=opsTeamBreakdown(final,o);const t=(o.templates||[]).find(x=>x.name===bd0.tname)||{core:[],flex:bd0.comp};const goals=[];

  const room=o.solo?0:Math.max(0,5-t.core.length-sacs.length);const want=[...t.core,...(t.flex||[]).filter(x=>!final.includes(x)).slice(0,Math.max(0,room-(t.flex||[]).filter(x=>final.includes(x)).length))];
  want.forEach(x=>{if(final.includes(x)||(o.alts&&(o.alts[x]||[]).some(a=>final.includes(a))))return;const u=S.heroes[x];
    if(!u||!u.owned)goals.push(`get ${short(H[x].name)}`);else if(copies&&!(copies[x]>0)&&!mine.includes(x))goals.push(`${short(H[x].name)} is used in another op you run — a 2nd copy would free him up`);else if(devRatio(x,mmx)<0.6&&!H[x].keepBase&&t.core.includes(x))goals.push(`build up ${short(H[x].name)} (level ${u.level})`);});

    if(miss){const x=sacs[0];const alt=(t.sacAny||[]).filter(a=>a!==x).slice(0,2).map(a=>short(H[a].name));const fish=x==='aquarus';
      goals.unshift(fish?`${miss} more ${short(H[x].name)} (fish: keep them at Elite+, level 160-200)`:`${miss} more sacrifice${miss>1?'s':''}: ${short(H[x].name)} copies at level 1 are best${alt.length?` (or level-1 ${alt.join(' / ')})`:''} — they only need to die`);}}
  [...new Set(t.core)].filter(x=>t.core.filter(y=>y===x).length>cnt(x)).forEach(x=>goals.unshift(`more copies of ${short(H[x].name)}`));

/* ---- wave records: every logged run keeps the team it was run with ---- */
const WDAYS=30, WMARGIN=0.02;
const tsig=t=>[...t].sort().join(',');
function wlog(k){return ((S.waves||{})[k]||[]);}
function opPB(k){return wlog(k).reduce((m,e)=>e.w>(m?m.w:0)?e:m,null);}
function teamPB(k,t,recent){const g=tsig(t),cut=Date.now()-WDAYS*864e5;return wlog(k).filter(e=>e.s===g&&(!recent||e.d>=cut)).reduce((m,e)=>Math.max(m,e.w),0);}
function teamsLogged(k){const m={};wlog(k).forEach(e=>{const r=m[e.s]||(m[e.s]={t:e.t,pb:0,d:0,n:0});r.n++;if(e.w>r.pb)r.pb=e.w;if(e.d>r.d)r.d=e.d;});return Object.values(m).sort((a,b)=>b.pb-a.pb);}
/* measured ratio new/old from recent logged runs, or null when either team has no recent run */
function measured(k,oldT,newT){const a=teamPB(k,oldT,true),b=teamPB(k,newT,true);return a&&b?{r:b/a,a,b}:null;}
function waveVerdict(k){const cur=myTeam(k);if(!cur.length)return null;const g=tsig(cur),cut=Date.now()-WDAYS*864e5;
  const mine=teamPB(k,cur,true);if(!mine)return null;
  const others=teamsLogged(k).filter(r=>tsig(r.t)!==g&&r.d>=cut);if(!others.length)return null;
  const prev=wlog(k).filter(e=>e.s!==g&&e.d>=cut).sort((a,b)=>b.d-a.d)[0];const pt=others.find(r=>tsig(r.t)===prev.s);

function fmtW(n){return Number(n).toLocaleString('en-GB');}
function opsClashes(){const rn=opsRun().map(o=>o.id);const use={};rn.forEach(k=>myTeam(k).forEach(id=>{(use[id]=use[id]||[]).push(k);}));
  return Object.entries(use).filter(([id,ks])=>ks.length>Math.max(1,+S.heroes[id].count||1)).map(([id,ks])=>({id,ops:[...new Set(ks)].map(k=>G.ops.find(o=>o.id===k).short),n:ks.length,have:Math.max(1,+S.heroes[id].count||1)}));}
function opsAdvice(){const res={};const mmx=maxMult();const prio=o=>({high:0,medium:1,low:2}[o.priority]??3);const all=G.ops.filter(o=>o.priority!=='event');
  const runIds=new Set(opsRun().map(o=>o.id));const run=all.filter(o=>runIds.has(o.id)).sort((a,b)=>prio(a)-prio(b));
  const copies={};owned().forEach(id=>copies[id]=Math.max(1,+S.heroes[id].count||1));
  run.forEach(o=>myTeam(o.id).forEach(id=>copies[id]--));
  const judge=(o,mine,pool,copiesForGoals)=>{const {pick,sac}=planOp(o,pool,mine,mmx);const a=opsTeamBreakdown(mine,o),b=opsTeamBreakdown(pick,o);
    let better=!!(mine.length&&!sac&&b.score>a.score*1.12);let why=better?whyBetter(a,b):'';let tried=null;
    const m=mine.length&&tsig(mine)!==tsig(pick)?measured(o.id,mine,pick):null;
    if(m){tried=m;if(m.r<1+WMARGIN){better=false;why='';}else{better=true;why=`your logged runs: ${fmtW(m.b)} waves vs ${fmtW(m.a)} with your current team`;}}
    const final=mine.length&&!better?mine:pick;
    return {o,mine,sug:final,better,why,tried,diff:better?teamDiff(mine,pick):null,goals:opsGoals(o,final,mine,copiesForGoals,mmx)};};

    const r=judge(o,mine,pool,copies);r.running=true;
    if(!mine.length||r.better){const back={};mine.forEach(id=>back[id]=(back[id]||0)+1);r.sug.forEach(id=>{if(back[id]>0)back[id]--;else copies[id]--;});Object.entries(back).forEach(([id,n])=>copies[id]+=n);}
    res[o.id]=r;});

/* Swaps between the ops you run: try moving/swapping heroes between your op teams (and bringing in free heroes),
   judging every op as a whole team. A move is only kept if the total (weighted by op priority) rises by 5%+ and no op
   loses part of the core of the player team it matches unless that op itself still improves. */
let _swK='',_swV=null;
function opsSwaps(){const k=JSON.stringify([S.teams,S.settings.opsRun,S.heroes,S.waves,S.swapLog]);if(k===_swK)return _swV;_swK=k;_swV=opsSwapsInner();return _swV;}
function opsMissingTeams(){return opsRun().filter(o=>!myTeam(o.id).length);}
/* heroes you moved into an op in the last 7 days stay put (unless your logged waves say otherwise) - no flip-flopping */
function recentlyIn(k,id){const cut=Date.now()-7*864e5;return (S.swapLog||[]).some(e=>e.k===k&&e.id===id&&e.d>=cut);}
function logTeamChange(k,before,after){const add=[...after];before.forEach(x=>{const i=add.indexOf(x);if(i>=0)add.splice(i,1);});S.swapLog=(S.swapLog||[]).filter(e=>e.d>=Date.now()-30*864e5);add.forEach(id=>S.swapLog.push({k,id,d:Date.now()}));}

  const sc=(k,t)=>opsTeamBreakdown(t,O[k]);const moves=[];const orig={},origSc={};run.forEach(o=>{orig[o.id]=[...teams[o.id]];origSc[o.id]=sc(o.id,orig[o.id]).score;});

    const free=owned().filter(id=>(Math.max(1,+S.heroes[id].count||1)-(used[id]||0))>0&&(H[id].keepBase||devRatio(id)>=0.45));
    const cur={};run.forEach(o=>cur[o.id]=sc(o.id,teams[o.id]));let best=null;
    const consider=(changes,desc)=>{let before=0,after=0,ok=true;const res={};
      Object.entries(changes).forEach(([k,t])=>{const a=cur[k];let b=sc(k,t);const m1=measured(k,teams[k],t),m0=measured(k,orig[k],t);
        if((m1&&m1.r<1+WMARGIN)||(m0&&m0.r<1+WMARGIN))ok=false;
        else if(m1||m0){const m=m1||m0;b=Object.assign({},b,{score:(m1?a.score:origSc[k])*m.r,cov:Math.max(a.cov,b.cov),logged:m});}

      if(!ok||after<before*1.05)return;const gain=after-before;const lg=Object.values(res).some(r=>r.logged);if(!best||(lg&&!best.lg)||(lg===best.lg&&gain>best.gain))best={gain,changes,res,desc,lg,pct:(after/before-1)*100};};
    for(let i=0;i<run.length;i++){const A=run[i].id;teams[A].forEach((x,ix)=>{
      for(let j=0;j<run.length;j++){if(j===i)continue;const B=run[j].id;teams[B].forEach((y,iy)=>{if(x===y)return;const ta=[...teams[A]];ta[ix]=y;const tb=[...teams[B]];tb[iy]=x;consider({[A]:ta,[B]:tb},{type:'swap',x,y,A,B});});}
      free.forEach(f=>{if(f===x||teams[A].includes(f)&&!H[f].keepBase)return;const ta=[...teams[A]];ta[ix]=f;consider({[A]:ta},{type:'free',x,f,A});});});}

/* ---------------- engine: next moves ---------------- */
/* The artifact plan you actually see: start from what you have, apply only the moves players/guides back (artifactPlan proposes,
   these rules filter), then hand every spare artifact to heroes in your teams left without one. Nothing ends up homeless. */
function finalArtifacts(pvp,raid){const raw=artifactPlan();const fin={};owned().forEach(id=>{const a=artByName(S.heroes[id].artifact);if(a&&ownedArts().includes(a.name))fin[id]=a.name;});
  const moves={},takenBy={};
  Object.entries(raw).forEach(([id,n])=>{const cur=(S.heroes[id]||{}).artifact;if(norm(cur)===norm(n))return;
    if(cur&&inMyTeams(id)&&heroImportance(id,pvp&&pvp.team,raid&&raid.team).v<0.5&&!(artByName(n)&&(artByName(n).owners||[])[0]===id))return;
    const bk=artBacking(n,id),bc=cur?artBacking(cur,id):null;
    if(!bk)return;if(bc&&bk!=='first')return;
    if(cur&&artByName(cur)&&artFit(n,id,[id],'pvp')<artFit(cur,id,[id],'pvp')*1.15&&!(bk==='first'))return;
    Object.keys(fin).forEach(k=>{if(k!==id&&norm(fin[k])===norm(n)){delete fin[k];}});
    if(fin[id])takenBy[norm(fin[id])]=null;fin[id]=n;moves[id]={n};takenBy[norm(n)]=id;});
  // refill: heroes in your teams with no artifact now, from what's spare (never from a hero the plan leaves alone)
  const tm={};Object.entries(S.teams||{}).forEach(([k,t])=>(t||[]).forEach(x=>{if(H[x]&&S.heroes[x]&&S.heroes[x].owned&&!tm[x])tm[x]={team:t,m:k==='pvp'?'pvp':'ops'};}));
  const used=new Set(Object.values(fin).map(norm));const spare=ownedArts().filter(n=>!used.has(norm(n))&&!/goldenapple/.test(norm(n)));
  const needy=Object.keys(tm).filter(x=>!fin[x]&&!H[x].keepBase).sort((a,b)=>heroImportance(b,pvp&&pvp.team,raid&&raid.team).v-heroImportance(a,pvp&&pvp.team,raid&&raid.team).v);
  if(spare.length&&needy.length){const M=needy.map(x=>spare.map(n=>Math.max(0.01,artFit(n,x,tm[x].team,tm[x].m))*(0.5+heroImportance(x,pvp&&pvp.team,raid&&raid.team).v)));
    bestAssignment(M).forEach((j,i)=>{if(j>=0){const x=needy[i];fin[x]=spare[j];moves[x]={n:spare[j],refill:true};}});}
  Object.keys(takenBy).forEach(k=>{if(!takenBy[k])delete takenBy[k];});
  // who loses what (for the card text)
  owned().forEach(k=>{const c=S.heroes[k].artifact;if(c&&norm(fin[k]||'')!==norm(c)){const t=Object.keys(fin).find(x=>norm(fin[x])===norm(c));if(t)takenBy[norm(c)]=t;}});
  return {fin,moves,takenBy};}
function nextMoves(){const ids=owned();const out=[];if(!ids.length)return out;
  const pvp=bestTeams('pvp',{n:1,enemy:S.settings.enemy})[0];const ops=bestTeams('ops',{n:1})[0];const raid={team:raidSquad().squad.slice(0,5)};
  const core=new Set([...(pvp?pvp.team:[]),...(ops?ops.team:[]),...(raid?raid.team:[])]);
  ids.forEach(id=>{if(['pvp','ops','raid'].some(m=>tierOf(id,m)==='S'))core.add(id);});
  Object.values(S.teams||{}).forEach(t=>(t||[]).forEach(id=>{if(S.heroes[id]&&S.heroes[id].owned)core.add(id);}));
  // patch alerts (two latest)
  /* patch changes: only shown on Home when there's something for you to do. Everything else stays in Database → Patches. */
  G.patches.slice(0,2).forEach(p=>p.items.forEach(it=>{if(!it.target||!['nerf','buff','change'].includes(it.kind))return;const id=it.target;
    if(!H[id]||!S.heroes[id]||!S.heroes[id].owned)return;const nm=short(H[id].name);const u=S.heroes[id];
    const opsIn=opsRun().filter(o=>myTeam(o.id).includes(id));const inPvp=((S.teams||{}).pvp||[]).includes(id);if(!opsIn.length&&!inPvp)return;
    const si=(H[id].skills||[]).findIndex(sk=>it.text.toLowerCase().includes(sk.name.toLowerCase()));const lvl=si>=0?Math.max(1,+(u.skills||[])[si]||1):null;
    const verb={nerf:'nerfed',buff:'buffed',change:'reworked'}[it.kind];
    if(si>=0&&lvl<=1){return;} /* you haven't levelled the changed skill: it barely affects you, and the skill cards already rank it */
    const fresh=p===G.patches[0];const acts=[];
    if(opsIn.length){const o=opsIn[0];const log=wlog(o.id).filter(e=>e.d<Date.parse(p.date||0)).length;
      acts.push(log?`Log your next ${o.short} run (Teams → GDA Ops → Waves): compare it with the best you logged before the patch.`:`Log your next ${o.short} run (Teams → GDA Ops → Waves) so you can tell if it changed his results.`);}
    if(inPvp&&it.kind==='nerf')acts.push(`If you start losing arena fights you used to win, try swapping him out of your PvP team.`);
    if(si>=0&&it.kind==='nerf'&&lvl>1)acts.push(`Hold off on more levels of ${H[id].skills[si].name} until you see how it does.`);
    if(!acts.length)return;
    out.push({p:fresh?(it.kind==='nerf'?80:56):30,st:it.kind==='nerf'?'alert':'info',stl:'Patch '+p.v,t:`${nm} was ${verb}`,d:it.text+(si>=0?` (yours is at level ${lvl}). `:' ')+acts.join(' '),hero:id});}));
  // core hero work
  const mmx=maxMult();
  core.forEach(id=>{const u=S.heroes[id],h=H[id];const cap=levelCap(u);
    if(h.keepBase)return;
    const inv=devRatio(id,mmx);const best=['pvp','ops','raid'].map(m=>[m,tierOf(id,m)]).find(x=>x[1]==='S')||['pvp','ops','raid'].map(m=>[m,tierOf(id,m)]).find(x=>x[1]==='A');
    if(inv<0.45){if(best)out.push({p:60,st:'go',stl:'Build up',t:`Build up ${short(h.name)}`,d:`Players rate him ${best[1]} for ${MODES[best[0]]}, but at ${u.rank} level ${u.level} he's far behind your main heroes. Rank and level first — skills can wait.`,hero:id});return;}
    const imp0=heroImportance(id,pvp&&pvp.team,raid.team);
    if((+u.level||0)<cap-1&&imp0.v>=0.3)out.push({p:52+25*imp0.v,st:'go',stl:'Level up',t:`Level ${short(h.name)} to ${cap}`,d:`At ${u.level||'?'} of ${cap} for ${u.rank}${u.rank==='Omnipotent+'&&u.stars?' ★'+u.stars:''}. Levels are the cheapest power in your best teams.`,hero:id});
    const imp=heroImportance(id,pvp&&pvp.team,raid.team);const ns=imp.v>=0.3?nextSkill(id):null;if(ns){const lvlOk=(+u.level||0)>=ns.req;const ready=lvlOk;
      const REFV=1*(0.6/9)/50;const vr=Math.min(1.5,ns.value/REFV);const sp=ns.cur<10?50+22*imp.v*Math.sqrt(vr):38+14*imp.v*Math.sqrt(vr);
      out.push({p:ready?sp:sp-30,st:ready?'go':'wait',stl:ready?'Skill next':'Skill blocked',t:`${short(h.name)}: ${ns.name} → ${ns.target}`,d:(H[id].skills[ns.i].target&&ns.cur<H[id].skills[ns.i].target?H[id].skills[ns.i].targetWhy+' ':'')+(ns.prio&&ns.prio!=='?'?`Players rate this skill ${ns.prio}${H[id].skills[ns.i].to15?' and take it to 15':''}. `:'')+(ns.gain.known?`Each level adds about ${+((Math.abs(ns.gain.b-ns.gain.a))/9).toFixed(2)}${ns.gain.unit==='%'?' percentage points':ns.gain.unit?' '+ns.gain.unit:''} (${ns.gain.a} at level 1 → ${ns.gain.b} at 10). `:'')+(imp.where.length?`Used in your ${imp.where.slice(0,3).join(', ')} team${imp.where.length>1?'s':''}. `:'')+(ns.cost?`Costs ${ns.cost.me} Molecular Enhancement${ns.cost.sme?' and '+ns.cost.sme+' Special':''}. `:'')+(!lvlOk?`Needs hero level ${ns.req}. `:''),hero:id});}
    const nr=null;if(nr)out.push({p:76,st:'go',stl:'Rank up',t:`Rank up ${short(h.name)} → ${nr.to}`,d:`You have ${u.copies} spare cop${u.copies==1?'y':'ies'}. Feed: ${nr.feed}.`,hero:id});
    if(h.totem&&!(+(S.totems[h.totem.name]||{}).level>0))out.push({p:30,st:'info',stl:'Totem',t:`Work towards ${h.totem.name}`,d:`${short(h.name)}'s totem (${h.totem.stat}). Totem fragments come from Alliance Warfare.`,hero:id});
  });
  // artifact moves: one consistent plan (finalArtifacts) - every move, and a replacement for anyone it leaves empty-handed
  {const fin=finalArtifacts(pvp,raid);const holder={};owned().forEach(k=>{const a=S.heroes[k].artifact;if(a)holder[norm(a)]=k;});
   Object.entries(fin.moves).forEach(([id,m])=>{const n=m.n,cur=(S.heroes[id]||{}).artifact;const a=artByName(n);const nm=short(H[id].name);const hubr=(H[id].artifacts||[]).find(r=>a&&norm(r.name)===norm(a.name));const bk=artBacking(n,id);
    const why=bk==='first'?'Players give this artifact to '+nm+' first. ':bk==='players'?'Players use this on '+nm+'. ':bk==='hub'?'GTG Hub recommends it for '+nm+(hubr&&hubr.note?' ('+hubr.note.replace(/\.$/,'')+')':'')+'. ':bk==='guide'?'LincGames lists it for '+nm+'. ':(a&&a.syn?'Players and guides rarely mention this artifact, so this goes by what it does: '+a.syn.why+'. ':'');
    const from=holder[norm(n)];const lost=m.refill?(cur?`${nm}'s ${cur} goes to ${short(H[fin.takenBy[norm(cur)]]?.name||'someone else')}, so he needs a replacement. `:`${nm} has no artifact. `):'';
    out.push({p:m.refill?64:66,st:'go',stl:'Artifact',t:`${n} → ${nm}`,d:lost+why+(cur&&!m.refill?`${nm} has ${cur} now. `:'')+(from&&from!==id?`Takes it from ${short(H[from].name)}. `:'Not on anyone at the moment. ')+'Artifacts swap everywhere at once, so this also applies in ops.',hero:id});});}
  // artifacts worth unlocking: each core hero's best artifact you don't own yet
  {const plan=artifactPlan();const own=new Set(ownedArts().map(norm));const seen=new Set();
   [...core].forEach(id=>{const h=H[id];
     const cands=[...G.artifacts.filter(a=>a.owners&&a.owners[0]===id),...(h.artifacts||[]).map(r=>artByName(r.name)).filter(Boolean)];
     const want=cands.find(a=>!own.has(norm(a.name))&&!(a.owners&&a.owners[0]!==id&&a.owners.slice(0,a.owners.indexOf(id)<0?99:a.owners.indexOf(id)).some(o=>S.heroes[o]&&S.heroes[o].owned)));
     if(!want||seen.has(want.name))return;const curFit=plan[id]?artFit(plan[id],id,[id],'pvp'):0;
     const lvSave=S.artifacts[want.name];S.artifacts[want.name]={level:20};const newFit=artFit(want.name,id,[id],'pvp');if(lvSave)S.artifacts[want.name]=lvSave;else delete S.artifacts[want.name];
     if(newFit<curFit*1.15)return;seen.add(want.name);
     out.push({p:42,st:'info',stl:'Unlock',t:`Work towards ${want.name}`,d:`${want.owners&&want.owners[0]===id?'Players give it to '+short(h.name)+' first':'A top pick for '+short(h.name)}${plan[id]?' — better than the '+plan[id]+' he can have now':', who has no good artifact from what you own'}. ${want.source?'Comes from: '+want.source+'.':'Where it drops isn\'t recorded yet.'}`,hero:id});});}
  // level the artifacts in the plan to their next ability step
  {const plan=artifactPlan();Object.entries(plan).forEach(([id,n])=>{if(!core.has(id))return;const lv=+(S.artifacts[n]||{}).level||1;if(lv>=30)return;const next=(Math.floor(lv/10)+1)*10;const a=artByName(n);
    out.push({p:a&&a.owners&&a.owners[0]===id?58:44,st:'go',stl:'Artifact level',t:`Level ${n} to ${next}`,d:`On ${short(H[id].name)}. Its ability gets stronger at level ${next} (steps at 10, 20 and 30); after 30 only its stats grow.`,hero:id});});}
  // other rank-ups
  ids.filter(id=>false).forEach(id=>{const u=S.heroes[id];const nr=nextRank(u);const t=tierOf(id,'pvp'),to=tierOf(id,'ops');if(nr&&nr.copy&&(+u.copies||0)>=(nr.n||1)&&(['S','A'].includes(t)||['S','A'].includes(to)))out.push({p:55,st:'go',stl:'Rank up',t:`Rank up ${short(H[id].name)} → ${nr.to}`,d:`Spare copies: ${u.copies}. Rated ${t} PvP / ${to} Ops.`,hero:id});});
  {const cl=opsClashes();if(cl.length)out.push({p:70,st:'alert',stl:'Ops clash',t:`${cl.length} hero${cl.length>1?'es are':' is'} in more than one op you run`,d:cl.map(c=>`${short(H[c.id].name)}: ${c.ops.join(', ')}`).join(' · ')+'. Switch off the ops you\'re not running in Teams → GDA Ops, or change a team.'});}
  opsRun().forEach(o=>{const v=waveVerdict(o.id);if(v&&v.res==='worse')out.push({p:75,st:'alert',stl:'Ops waves',t:`${o.short}: your current team is doing worse`,d:`${fmtW(v.mine)} waves vs ${fmtW(v.prev.pb)} with your previous team (${v.prev.t.map(x=>short(H[x].name)).join(', ')}). Consider switching back.`});});
  {const sw=opsSwaps();sw.forEach((m,i)=>out.push({p:68-i,st:'go',stl:'Ops swap',t:m.text,d:`+${m.pct.toFixed(0)}% for those ops. ${m.why}.`}));}
  // your ops teams
  {const A=opsAdvice();let unset=0;Object.values(A).forEach(r=>{if(!r.mine.length){if(r.running)unset++;return;}if(r.better&&r.running)out.push({p:64,st:'go',stl:'Ops team',t:`${r.o.short}: put in ${r.diff.ins.map(x=>short(H[x].name)).join(', ')}`,d:`Better than your current ${r.o.name} team (${r.why}), using heroes you're not running in other ops${r.diff.outs.length?' (take out '+r.diff.outs.map(x=>short(H[x].name)).join(', ')+')':''}.`});else if(r.running&&r.goals.length&&r.o.priority==='high')out.push({p:36,st:'info',stl:'Ops goal',t:`${r.o.short}: ${r.goals[0]}`,d:`Players' ${r.o.name} team: ${opComp(r.o).map(x=>short(H[x].name)).join(', ')}. To improve: ${r.goals.join('; ')}.`});});
   if(unset)out.push({p:26,st:'info',stl:'Ops teams',t:`Add your teams for ${unset} op${unset>1?'s':''}`,d:'Teams → GDA Ops → "Set my current team". Then advice keeps what works for you and only suggests clear upgrades.'});}
  // chase
  const want={};G.comps.filter(c=>c.mode==='pvp').forEach(c=>c.heroes.forEach(x=>{if(!(S.heroes[x]&&S.heroes[x].owned))want[x]=(want[x]||0)+c.strength;}));
  Object.entries(want).sort((a,b)=>b[1]-a[1]).slice(0,3).forEach(([x,w])=>out.push({p:38,st:'info',stl:'Chase',t:`Watch the shop for ${short(H[x].name)}`,d:`In ${G.comps.filter(c=>c.mode==='pvp'&&c.heroes.includes(x)).length} of the top PvP teams players use. ${H[x].note||''}`,hero:x}));
  // food
  const food=ids.filter(id=>!core.has(id)&&(H[id].build==='Solely Food'||(['F','C'].includes(tierOf(id,'pvp'))&&['F','C','B'].includes(tierOf(id,'ops')))));
  if(food.length)out.push({p:24,st:'info',stl:'Fodder',t:`Safe to feed: ${food.length} hero${food.length>1?'es':''}`,d:food.map(id=>short(H[id].name)).join(', ')+'. Not in any of your best teams and rated low by players. Use them as same-faction rank-up fodder.'});
  return out.sort((a,b)=>b.p-a.p);}

/* ---------------- UI shell ---------------- */
const TABS=[['home','Home'],['roster','Roster'],['teams','Teams'],['db','Database'],['more','More']];
let tab='home', sub={};
const _scroll={};function setTab(t){const same=t===tab;_scroll[tab]=window.scrollY;tab=t;if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);render();window.scrollTo(0,same?0:(_scroll[t]||0));}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-tab="${k}"><span>${l.toUpperCase()}</span></button>`).join('');}
function renderHeader(){document.getElementById('hdrLvl').textContent=S.player.level||'—';document.getElementById('hdrName').textContent=(S.player.name?S.player.name.toUpperCase()+' · ':'')+'GTG ADVISOR';
  const n=owned().length;document.getElementById('hdrPills').innerHTML=`<span class="pill"><span>${n} heroes</span></span><span class="pill"><span>${ownedArts().length} artifacts</span></span>`;}
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.opid){sub.opOpen=sub.opOpen||{};sub.opOpen[d.dataset.opid]=d.open;}},true);
function setHdrH(){const hd=document.querySelector('header.top');if(hd)document.documentElement.style.setProperty('--hdrH',hd.offsetHeight+'px');}
window.addEventListener('resize',setHdrH);
function render(){try{renderHeader();renderTabs();const v=document.getElementById('view');v.innerHTML=(VIEWS[tab]||VIEWS.home)()+footer();setHdrH();if(window.gtgAfterRender)try{gtgAfterRender();}catch(e){}document.getElementById('err').style.display='none';}catch(e){showErr(e);}}
function footer(){return `<footer>${APP_VERSION} · game data ${esc(G.meta.gameVersion)} (built ${esc(G.meta.built)})<br>Advice is an estimate from community data and your inputs — always check in game.<br>${dbOk?'Saved to your Claude account':'Saved on this device'}</footer>`;}
function showErr(e){const el=document.getElementById('err');el.innerHTML=`Something went wrong drawing this screen. <button class="btn small" onclick="setTab('home')">Go home</button><div class="tiny" style="margin-top:4px">Details: ${esc(e&&e.message||e)}</div>`;el.style.display='block';console.error(e);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600);}

/* ---------------- views ---------------- */
const VIEWS={};
VIEWS.home=function(){const ids=owned();
  let h=`<div class="band"><div><div class="sub">Game ${esc(G.meta.gameVersion)} · meta ${esc(G.meta.built)}</div><h1>NEXT MOVES</h1></div></div>`;
  if(!ids.length){return h+`<div class="card"><h3>Start with your roster</h3><div class="rule"></div><p>Add the heroes you own with their rank, level and skills. Everything here — teams, artifacts, upgrades — is worked out from them.</p></div><button class="cta" onclick="setTab('roster')">ADD MY HEROES</button>
  <div class="sec">Meanwhile: what players use</div>${G.comps.filter(c=>c.mode==='pvp').slice(0,3).map(compCard).join('')}`;}
  const mv=nextMoves();
  /* grouped by what you'd be doing, sections ordered by their most important card; repeated boilerplate said once per section */
  const SEC=[['ops',/^Ops|^Teams?/,'Teams & ops','teams'],['art',/^Artifact|^Unlock/,'Artifacts',null],['skill',/^Skill/,'Skills',null],['hero',/^Level up|^Build up|^Rank up|^Chase|^Fodder/,'Heroes','roster'],['patch',/^Patch/,'Patch changes',null],['other',/./,'Other',null]];
  const NOTE={art:'Artifacts swap everywhere at once, so a change here also applies in ops.'};
  const strip=d=>String(d).replace(/\s*Artifacts swap everywhere at once, so this also applies in ops\.?/,'');
  const card=m=>`<div class="card compact"${m.hero?` data-hero="${esc(m.hero)}"`:''}>${m.st==='alert'?'<span class="dot"></span>':''}<div class="row" style="margin-bottom:3px"><span class="status ${m.st}">${esc(m.stl)}</span></div><h3>${esc(m.t)}</h3><div class="rule"></div><p>${esc(strip(m.d))}</p></div>`;
  if(!mv.length)h+='<div class="card"><p>Nothing urgent. Fill in skill levels for sharper advice.</p></div>';
  const groups={};mv.forEach((m,i)=>{const sec=SEC.find(x=>x[1].test(m.stl));(groups[sec[0]]=groups[sec[0]]||{sec,items:[],top:i}).items.push(m);});
  Object.values(groups).sort((a,b)=>a.top-b.top).forEach(g=>{const [key,,label,go]=g.sec;const show=g.items.slice(0,3),rest=g.items.slice(3);
    h+=`<div class="hsec"><span>${label}</span><small>${g.items.length} suggestion${g.items.length>1?'s':''}${go?` · <a href="#" onclick="setTab('${go}');return false" style="color:var(--accent,#3aa8ff)">open ${go==='teams'?'Teams':'Roster'} ›</a>`:''}</small></div>`+(NOTE[key]?`<p class="tiny muted" style="margin:-2px 0 6px">${NOTE[key]}</p>`:'')+show.map(card).join('');
    if(rest.length)h+=`<details class="card" style="padding-top:8px;padding-bottom:8px"><summary class="tiny"><b>${rest.length} more ${label.toLowerCase()}</b></summary><div>${rest.map(m=>`<p style="margin:8px 0"${m.hero?` data-hero="${esc(m.hero)}"`:''}><b>${esc(m.t)}</b> — ${esc(strip(m.d))}</p>`).join('')}</div></details>`;});
  const best=bestTeams('pvp',{n:1,enemy:S.settings.enemy})[0];
  if(best){h+=`<div class="sec">Best PvP team you own <small>${best.score.toFixed(0)} pts</small></div><div class="grid5">${best.team.map(id=>tileHTML(id,{mini:true,mode:'pvp'})).join('')}</div>`;
    const top=G.comps.find(c=>c.mode==='pvp');const have=top.heroes.filter(x=>S.heroes[x]&&S.heroes[x].owned);
    h+=`<p class="tiny muted" style="margin:8px 0 10px">Players' top team: ${esc(top.name)} — you have ${have.length} of 5${have.length<5?' (missing '+esc(top.heroes.filter(x=>!have.includes(x)).map(x=>short(H[x].name)).join(', '))+')':''}.</p><button class="cta" onclick="setTab('teams')">SEE ALL TEAMS</button>`;}
  return h;};
function compCard(c){return `<div class="card"><div class="kicker">${esc(MODES[c.mode]||c.mode)}</div><h3>${esc(c.name)}</h3><div class="rule"></div><p>${esc(c.note)}</p><div class="grid5" style="margin-top:8px">${c.heroes.map(id=>tileHTML(id,{mini:true,dim:true,mode:c.mode})).join('')}</div></div>`;}

VIEWS.roster=function(){const f=sub.rf||'mine';const q=sub.rq||'';const sort=sub.rs||S.settings.rosterSort||'level';const view=sub.rv||S.settings.rosterView||'grid';const role=sub.rr||'';
  let h=`<div class="band"><div><div class="sub">Tap a hero to edit</div><h1>ROSTER</h1></div><button class="btn gold" onclick="openAdd()">+ ADD HERO</button></div>`;
  h+=`<div class="stick"><div class="row" style="gap:6px"><div class="srch"><input class="in" placeholder="Search heroes" value="${esc(q)}" id="rq" autocomplete="off">${q?'<button class="x" data-rqclear="1" aria-label="Clear search">✕</button>':''}</div>

function stepper(key,val,min,max){return `<div class="stepper" style="width:118px"><button data-step="${esc(key)}" data-d="-1" aria-label="Less">−</button><input class="in" data-stepin="${esc(key)}" inputmode="numeric" value="${val}" data-min="${min}" data-max="${max}"><button data-step="${esc(key)}" data-d="1" aria-label="More">+</button></div>`;}
function parseAmt(s){s=String(s||'').trim().replace(/,/g,'');if(!s)return '';const m=s.match(/^([\d.]+)\s*([kmb])?$/i);if(!m)return null;let n=parseFloat(m[1]);const u=(m[2]||'').toLowerCase();if(u==='k')n*=1e3;if(u==='m')n*=1e6;if(u==='b')n*=1e9;return Math.round(n);}

function fitRankToLevel(){const r=document.getElementById('hRank'),st=document.getElementById('hStars'),lvI=document.getElementById('hLevel');if(!r||!lvI)return;
  const lv=parseInt(lvI.value)||0;const u={rank:r.value,stars:+(st&&st.value)||0};if(!lv||lv<=levelCap(u))return;
  let msg;if(lv>660){const need=Math.ceil((lv-660)/20);r.value='Omnipotent+';st.value=Math.max(u.rank==='Omnipotent+'?u.stars:0,need);msg=`Set to Omnipotent+ ★${st.value} for level ${lv}`;}
  else{const i=G.rankTable.findIndex((x,k)=>k>=rankIndex(u.rank)&&x.cap>=lv);r.value=G.rankTable[i].rank;msg=`Rank set to ${r.value} for level ${lv}`;}
  toast(msg);}
function updCap(){const r=document.getElementById('hRank');if(!r)return;const st=document.getElementById('hStars');const u={rank:r.value,stars:+(st&&st.value)||0};const cap=levelCap(u);document.getElementById('capLbl').textContent='(cap '+cap+')';document.getElementById('starsF').style.visibility=r.value==='Omnipotent+'?'visible':'hidden';

  u.owned=own;if(own){u.rank=document.getElementById('hRank').value;u.stars=u.rank==='Omnipotent+'?Math.max(0,parseInt(document.getElementById('hStars').value)||0):0;
    let lv=parseInt(document.getElementById('hLevel').value)||0;const cap=levelCap(u);if(lv>cap){lv=cap;('Level set to the cap for '+u.rank+(u.stars?' ★'+u.stars:''));}u.level=lv||cap;
    
    u.count=Math.max(1,parseInt(document.getElementById('hCount').value)||1);
    u.skills=h.skills.map((s,i)=>{const v=parseInt((document.querySelector(`[data-sk="${i}"]`)||{}).value);return skillUnlocked(u,i)?Math.min(15,Math.max(1,v||1)):0;});
    u.artifact=document.getElementById('hArt').value||'';
    if(u.artifact){Object.keys(S.heroes).forEach(o=>{if(o!==id&&norm(S.heroes[o].artifact)===norm(u.artifact)){S.heroes[o].artifact='';toast(u.artifact+' moved from '+short(H[o].name));}});const al=parseInt(document.getElementById('hArtLv').value)||0;if(al>0)S.artifacts[u.artifact]={level:al};}
    const tt=document.getElementById('hTot');if(tt&&h.totem){const tl=Math.max(0,parseInt(tt.value)||0);S.totems[h.totem.name]={level:tl};}}
  S.heroes[id]=u;const ov={};document.querySelectorAll('[data-ov]').forEach(s=>{if(s.value)ov[s.dataset.ov]=s.value;});if(Object.keys(ov).length)S.overrides[id]=ov;else delete S.overrides[id];
  save();if(close){closeSheet();toast('Saved '+short(h.name));}}

  <div class="row" style="margin-bottom:10px;gap:6px;flex-wrap:wrap"><button class="btn small" data-tmclear="1">Clear</button>${cur.length>1&&k!=='raid'?`<button class="btn small" data-tmsugg="1">Suggested positions</button>`:''}<button class="cta" style="flex:1" data-tmdone="1">DONE</button></div>
  <div class="grid4">${ids.map(id=>{const n=cur.filter(x=>x===id).length;const rn=new Set(opsRun().map(o=>o.id));const usedElse=Object.entries(S.teams||{}).filter(([kk,t])=>kk!==k&&rn.has(kk)&&rn.has(k)).reduce((a,[,t])=>a+t.filter(x=>x===id).length,0);const max=Math.max(0,Math.max(1,+S.heroes[id].count||1)-usedElse);return `<button class="tile mini ${factionClass(H[id])} ${n>=max?'off':''}" data-tmadd="${esc(id)}"><span class="glyph">${GLYPH[H[id].role]||''}</span><span class="nm">${esc(short(H[id].name))}</span><span class="strip"><span>${esc(S.heroes[id].level)}</span>${n?`<span class="st">✓${max>1?n+'/'+max:''}</span>`:''}</span></button>`;}).join('')}</div>`);}
/* move a hero to another position: swap with whoever is there; onto an empty position = to the end of the line-up */
function moveSlot(cur,a,b){if(a===b||!cur[a])return;if(b<cur.length){[cur[a],cur[b]]=[cur[b],cur[a]];}else{const x=cur.splice(a,1)[0];cur.push(x);}setTeam(cur);}
let _drag=null,_dragDone=false;

  const over=document.elementFromPoint(e.clientX,e.clientY)?.closest('#tmCur [data-slot]');document.querySelectorAll('#tmCur .pslot.over').forEach(x=>x.classList.remove('over'));
